<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Task Engineering App</title>
	<link rel="stylesheet" href="css/styles.css">
</head>
<body>
	<main class="app-shell">
		<section class="hero">
			<div class="hero__copy">
				<p class="eyebrow">Task Engineering</p>
				<h1>Organiza tareas con un formulario claro y rápido.</h1>
				<p class="hero__text">
					Crea, prioriza y sigue tus tareas desde una interfaz simple pensada para este proyecto.
				</p>
			</div>

			<div class="hero__stats" aria-label="Resumen de tareas">
				<article>
					<span id="totalTasks">0</span>
					<small>Total</small>
				</article>
				<article>
					<span id="pendingTasks">0</span>
					<small>Pendientes</small>
				</article>
				<article>
					<span id="doneTasks">0</span>
					<small>Completadas</small>
				</article>
			</div>
		</section>

		<section class="content-grid">
			<form id="taskForm" class="task-form" novalidate>
				<div class="section-heading">
					<p class="eyebrow">Nueva tarea</p>
					<h2>Formulario de tareas</h2>
				</div>

				<label>
					<span>Título</span>
					<input type="text" id="taskTitle" name="taskTitle" placeholder="Ej. Revisar backlog" maxlength="80" required>
				</label>

				<label>
					<span>Descripción</span>
					<textarea id="taskDescription" name="taskDescription" rows="4" placeholder="Agrega contexto breve sobre la tarea" maxlength="240"></textarea>
				</label>

				<div class="form-row">
					<label>
						<span>Prioridad</span>
						<select id="taskPriority" name="taskPriority" required>
							<option value="alta">Alta</option>
							<option value="media" selected>Media</option>
							<option value="baja">Baja</option>
						</select>
					</label>

					<label>
						<span>Fecha límite</span>
						<input type="date" id="taskDueDate" name="taskDueDate" required>
					</label>
				</div>

				<label>
					<span>Categoría</span>
					<input type="text" id="taskCategory" name="taskCategory" placeholder="Ej. Diseño, QA, Desarrollo" maxlength="40">
				</label>

				<div class="form-actions">
					<button type="submit" class="btn btn--primary">Agregar tarea</button>
					<button type="reset" class="btn btn--secondary">Limpiar</button>
				</div>

				<p id="formMessage" class="form-message" aria-live="polite"></p>
			</form>

			<section class="task-board" aria-labelledby="taskBoardTitle">
				<div class="section-heading">
					<p class="eyebrow">Listado</p>
					<h2 id="taskBoardTitle">Tareas registradas</h2>
				</div>

				<div id="taskList" class="task-list" aria-live="polite"></div>
			</section>
		</section>
	</main>

	<template id="taskTemplate">
		<article class="task-card">
			<div class="task-card__header">
				<div>
					<h3 class="task-card__title"></h3>
					<p class="task-card__meta"></p>
				</div>
				<span class="task-card__priority"></span>
			</div>

			<p class="task-card__description"></p>

			<div class="task-card__footer">
				<span class="task-card__date"></span>
				<div class="task-card__actions">
					<button type="button" class="btn btn--ghost task-toggle">Completar</button>
					<button type="button" class="btn btn--danger task-delete">Eliminar</button>
				</div>
			</div>
		</article>
	</template>

	<script src="js/app.js"></script>
</body>
</html>
